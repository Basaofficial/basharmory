<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>#Bash Armory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#0b0f0b; --card2:#111811; --line:#1d2a1d;
  --g:#8cff2e; --g2:#5fd400; --gdim:#8cff2e22; --txt:#e8ffe0; --mut:#86a17c;
  --q0:#9d9d9d; --q1:#ffffff; --q2:#1eff00; --q3:#0070dd; --q4:#a335ee; --q5:#ff8000; --q6:#e6cc80; --q7:#e6cc80;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:84px;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px}
.hand{font-family:"Permanent Marker",cursive;letter-spacing:.5px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{margin:0;font-size:26px;color:var(--g);text-shadow:0 0 18px #8cff2e66}
header .sub{color:var(--mut);font-size:12px}
.back{background:none;border:1px solid var(--line);color:var(--g);width:38px;height:38px;border-radius:12px;font-size:18px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 8px 30px #000a, inset 0 1px 0 #ffffff08}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
input,select{width:100%;background:#050805;border:1px solid var(--line);color:var(--txt);padding:13px 14px;border-radius:12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gdim)}
.btn{background:var(--g);color:#000;border:0;padding:13px 16px;border-radius:12px;font-weight:800;font-size:15px;box-shadow:0 6px 20px #8cff2e40;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--g);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#070a07;padding:7px 11px;border-radius:999px;font-size:13px;color:var(--txt)}
.chip.on{border-color:var(--g);color:var(--g);background:var(--gdim)}
.mut{color:var(--mut)} .sm{font-size:12px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #ffffff08;cursor:pointer}
.list .it:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:#444;flex:none}
.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.hero{display:flex;gap:14px;align-items:center}
.crest{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#000;flex:none}
.hero h2{margin:0;font-size:24px}
.gs{font-size:30px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#050805;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px} .stat span{font-size:11px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#060906;color:var(--mut);font-weight:600}
.tab.on{color:#000;background:var(--g);border-color:var(--g)}
.item{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid #ffffff08}
.ico{width:40px;height:40px;border-radius:9px;border:2px solid #333;background:#111 center/cover;flex:none;display:grid;place-items:center;font-size:10px;color:var(--mut);overflow:hidden}
.item .nm{font-weight:600;font-size:14px}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}.q6{color:var(--q6)}.q7{color:var(--q7)}
.b0{border-color:var(--q0)!important}.b1{border-color:#bbb!important}.b2{border-color:var(--q2)!important}.b3{border-color:var(--q3)!important}.b4{border-color:var(--q4)!important;box-shadow:0 0 8px #a335ee55}.b5{border-color:var(--q5)!important;box-shadow:0 0 10px #ff800066}.b6,.b7{border-color:var(--q6)!important}
.bar{height:8px;background:#0a120a;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g))}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.err{border-color:#ff3b3b55;color:#ffb3b3}
.spin{width:34px;height:34px;border:3px solid #8cff2e22;border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#000000e6;backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;font-weight:600}
nav button .i{font-size:20px}
nav button.on{color:var(--g)}
/* paper doll */
.doll{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:start}
.doll .side{display:flex;flex-direction:column;gap:6px}
.doll .slot{width:48px;height:48px;border-radius:10px;border:2px solid #222;background:#0a0a0a center/cover;display:grid;place-items:center;font-size:9px;color:#555;cursor:pointer;position:relative}
.doll .center{position:relative;border-radius:16px;border:1px solid var(--line);min-height:100%;background:radial-gradient(ellipse at 50% 35%,#8cff2e18,transparent 65%),#030503;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.doll .bottom{grid-column:1/4;display:flex;justify-content:center;gap:8px}
.sil{width:70%;max-width:180px;opacity:.9;filter:drop-shadow(0 0 16px currentColor)}
#model3d{width:100%;aspect-ratio:3/4;border-radius:16px;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 40%,#8cff2e20,#000 70%);position:relative;overflow:hidden}
#model3d canvas{width:100%!important;height:100%!important}
.tip{position:fixed;left:12px;right:12px;bottom:90px;z-index:9;background:#050805f5;border:1px solid var(--g);border-radius:14px;padding:12px;font-size:13px;max-height:55vh;overflow:auto;box-shadow:0 10px 40px #000}
.tip table{width:100%;border-collapse:collapse;color:var(--txt);font-size:13px}
.tip td,.tip th{padding:0;text-align:left;font-weight:400;vertical-align:top}
.tip th{text-align:right}
.tip .q,.tip .q1{color:#fff}.tip .q2{color:var(--q2)}.tip .q3{color:var(--q3)}.tip .q4{color:var(--q4)}.tip .q5{color:var(--q5)}
.tip a{color:var(--g)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;box-shadow:0 8px 30px #8cff2e55}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--gdim);color:var(--g);border:1px solid #8cff2e55}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff08;font-size:14px}
.vs .l{text-align:right}.vs .m{color:var(--mut);font-size:11px;text-align:center;min-width:80px}
.win{color:var(--g);font-weight:800}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#050805;border-top:1px solid var(--g);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;box-shadow:0 -10px 40px #000}
.shade{position:fixed;inset:0;background:#000a;z-index:14}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ffffff08}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:#8cff2e;flex:none}
.pts{font-weight:800;font-size:17px;min-width:56px;text-align:right}
.neg{color:#ff6b6b}.pos{color:var(--g)}
.updbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:30;background:#0b140b;border:1px solid var(--g);border-radius:14px;padding:12px;box-shadow:0 10px 30px #000}
.ttabs{display:flex;gap:6px;margin-bottom:10px}
.ttabs button{flex:1;padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:#060906;color:var(--mut);font-weight:700;font-size:13px}
.ttabs button.on{border-color:var(--g);color:var(--g);background:var(--gdim)}
.tree{position:relative;border-radius:16px;border:1px solid var(--line);padding:12px 8px;background:#000 center/cover;overflow:hidden}
.tree::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000a,#000d)}
.tgrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:58px;gap:0;justify-items:center;align-items:center}
.tal{position:relative;width:44px;height:44px;border-radius:9px;border:2px solid #333;background:#111 center/cover;filter:grayscale(1) brightness(.45);z-index:2}
.tal.p{filter:none;border-color:#40c040;box-shadow:0 0 10px #40c04066}
.tal.m{filter:none;border-color:#ffd100;box-shadow:0 0 10px #ffd10066}
.tal .rk{position:absolute;right:-7px;bottom:-7px;background:#000;border:1px solid #444;border-radius:7px;font-size:10px;font-weight:800;padding:1px 4px;color:#9a9a9a}
.tal.p .rk{color:#40ff40;border-color:#40c040}.tal.m .rk{color:#ffd100;border-color:#ffd100}
.arrow{position:absolute;width:4px;background:#555;z-index:1;border-radius:2px}
.arrow.on{background:#ffd100}
.thead{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tm{position:absolute;left:-4px;top:-4px;background:#c070ff;color:#000;font-size:9px;font-weight:900;border-radius:5px;padding:0 3px;z-index:3}
.ico,.doll .slot{position:relative}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app"></div>
<nav id="nav">
  <button data-go="home" class="on"><span class="i">⌕</span>Traži</button>
  <button data-go="favs"><span class="i">★</span>Favoriti</button>
  <button data-go="dkp"><span class="i">◈</span>DKP</button>
  <button data-go="compare"><span class="i">⚔</span>Poredi</button>
  <button data-go="settings"><span class="i">⚙</span>Postavke</button>
</nav>
<script src="talents.js"></script>
<script>
/* ===================== #Bash Armory ===================== */
const REALMS = ["Icecrown","Lordaeron","Onyxia","Blackrock","Frostwolf","Frostmourne"];
const CLASS = {
  "Death Knight":"#C41E3A","Druid":"#FF7C0A","Hunter":"#AAD372","Mage":"#3FC7EB","Paladin":"#F48CBA",
  "Priest":"#FFFFFF","Rogue":"#FFF468","Shaman":"#0070DD","Warlock":"#8788EE","Warrior":"#C69B6D","Monk":"#00FF98"
};
const RACE_ID = {"Human":1,"Orc":2,"Dwarf":3,"Night Elf":4,"Undead":5,"Tauren":6,"Gnome":7,"Troll":8,"Goblin":9,"Blood Elf":10,"Draenei":11,"Worgen":22};
const RACE_MODEL = {1:"human",2:"orc",3:"dwarf",4:"nightelf",5:"scourge",6:"tauren",7:"gnome",8:"troll",9:"goblin",10:"bloodelf",11:"draenei",22:"worgen"};
const ARMORY = "https://armory.warmane.com";
const LS = {
  get(k,d){try{const v=localStorage.getItem("ba_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ba_"+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  realm: LS.get("realm","Icecrown"),
  favs: LS.get("favs",[]),
  recent: LS.get("recent",[]),
  proxy: LS.get("proxy",""),
  cmp: LS.get("cmp",[null,null]),
  view: "home", stack: [], cache:{}
};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const J = o => esc(JSON.stringify(o));
const num = v => { const n = parseInt(v,10); return isNaN(n)?0:n; };
const fmt = n => num(n).toLocaleString("de-DE");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ---------- HTTP: native bridge (APK, no CORS) -> direct -> proxy ---------- */
const pending = {}; let reqId = 0;
window.__nativeCb = (id, ok, body) => { const p = pending[id]; if(!p) return; delete pending[id]; ok ? p.res(body) : p.rej(new Error(body||"Mreža")); };
function nativeGet(url){
  return new Promise((res,rej)=>{ const id="r"+(++reqId); pending[id]={res,rej}; window.BashNative.get(id,url);
    setTimeout(()=>{ if(pending[id]){delete pending[id];rej(new Error("Timeout"))} },25000); });
}
async function getText(url){
  if (window.BashNative && window.BashNative.get) return nativeGet(url);
  try { const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return await r.text(); }
  catch(e){
    if (!S.proxy) throw new Error("Browser blokira zahtjev (CORS). Koristi APK ili dodaj proxy u Postavkama.");
    const r = await fetch(S.proxy + encodeURIComponent(url)); if(!r.ok) throw new Error("Proxy HTTP "+r.status); return await r.text();
  }
}
async function getJSON(url){
  const t = await getText(url);
  let j; try { j = JSON.parse(t); } catch(e){ throw new Error("Server nije vratio podatke (možda je armory trenutno nedostupan)."); }
  if (j && j.error) throw new Error(j.error);
  return j;
}

/* ---------- Warmane API ---------- */
async function apiChar(name, realm){
  if (realm === "DEMO") return JSON.parse(JSON.stringify(DEMO_CHAR));
  return getJSON(`${ARMORY}/api/character/${encodeURIComponent(name)}/${encodeURIComponent(realm)}/summary`);
}
async function apiGuild(name, realm){
  if (realm === "DEMO") return JSON.parse(JSON.stringify(DEMO_GUILD));
  return getJSON(`${ARMORY}/api/guild/${encodeURIComponent(name)}/${encodeURIComponent(realm)}/summary`);
}

/* ---------- Item data (Wowhead WotLK): ilvl, quality, slot, icon, displayId ---------- */
const SLOT_BY_NAME = {"head":1,"neck":2,"shoulder":3,"shirt":4,"chest":5,"waist":6,"legs":7,"feet":8,"wrist":9,"hands":10,"finger":11,"trinket":12,"one-hand":13,"shield":14,"ranged":15,"back":16,"two-hand":17,"tabard":19,"robe":20,"main hand":21,"off hand":22,"held in off-hand":23,"thrown":25,"relic":28};
function tmogOf(e){
  for (const k of ["transmog","transmogid","transmog_id","transmogrify","transmogrification","tmog","appearance","fakeentry","fake_entry","display"]){
    const v=e[k]; if (v==null || v==="" || v===0 || v==="0") continue;
    if (typeof v==="object"){ const n=num(v.item||v.entry||v.id||v.itemid); if(n && n!==itemIdOf(e)) return n; continue; }
    const n=num(v); if (n && n!==itemIdOf(e)) return n;
  }
  return 0;
}
async function tmogFromPage(ch, eq){ // Warmane page item links carry "item=ID ... transmog=ID"
  const html=await getText(`${ARMORY}/character/${encodeURIComponent(ch.name)}/${encodeURIComponent(ch.realm)}/summary`);
  const map={}; const re=/item=(\d+)[^"'<>]*?(?:transmog|tmog|fake)=(\d+)/gi; let m;
  while ((m=re.exec(html))) if (m[2]!=="0" && m[1]!==m[2]) map[m[1]]=num(m[2]);
  const re2=/(?:transmog|tmog|fake)=(\d+)[^"'<>]*?item=(\d+)/gi;
  while ((m=re2.exec(html))) if (m[1]!=="0" && m[1]!==m[2]) map[m[2]]=map[m[2]]||num(m[1]);
  eq.forEach(e=>{ const t=map[itemIdOf(e)]; if (t) e._tm=t; });
  S.tmDebug = Object.keys(map).length+" transmog linkova na stranici";
}
function itemIdOf(e){ return num(e && (e.item || e.itemid || e.id || e.entry)); }
async function itemInfo(id){
  if (!id) return null;
  if (DEMO_ITEMS[id]) return DEMO_ITEMS[id];
  const ck = LS.get("it_"+id, null); if (ck) return ck;
  let info = null;
  try { // XML: has displayId + inventorySlot (best, works in APK)
    const x = await getText(`https://www.wowhead.com/wotlk/item=${id}&xml`);
    const d = new DOMParser().parseFromString(x,"text/xml");
    const g = s => d.querySelector(s);
    if (g("item")) {
      info = { id, name: g("name")?.textContent||"", ilvl: num(g("level")?.textContent),
        quality: num(g("quality")?.getAttribute("id")), icon: g("icon")?.textContent||"",
        displayId: num(g("icon")?.getAttribute("displayId")), slot: num(g("inventorySlot")?.getAttribute("id")),
        tooltip: g("htmlTooltip")?.textContent||"" };
    }
  } catch(e){}
  if (!info) { try { // tooltip JSON fallback
    const j = JSON.parse(await getText(`https://nether.wowhead.com/wotlk/tooltip/item/${id}`));
    const tt = j.tooltip||"";
    const il = tt.match(/Item Level (?:<!--ilvl-->)?(\d+)/i);
    const sm = tt.match(/<td>(Head|Neck|Shoulder|Back|Chest|Shirt|Tabard|Wrist|Hands|Waist|Legs|Feet|Finger|Trinket|One-Hand|Two-Hand|Main Hand|Off Hand|Held In Off-hand|Ranged|Thrown|Relic)<\/td>/i);
    let slot = sm ? SLOT_BY_NAME[sm[1].toLowerCase()] : 0;
    if (slot===22 && /Shield/i.test(tt)) slot = 14;
    info = { id, name:j.name||"", ilvl: il?num(il[1]):0, quality:num(j.quality), icon:j.icon||"", displayId:0, slot, tooltip:tt };
  } catch(e){} }
  if (info) LS.set("it_"+id, info);
  return info;
}
const iconUrl = (icon, size="large") => icon ? `https://wow.zamimg.com/images/wow/icons/${size}/${String(icon).toLowerCase()}.jpg` : "";

/* ---------- GearScore (GearScoreLite 3.3.5 formula) ---------- */
const GS_A = {4:[91.45,0.65],3:[81.375,0.8125],2:[73,1]};
const GS_B = {4:[26,1.2],3:[0.75,1.8],2:[8,2],1:[0,2.25]};
const GS_SLOTMOD = {1:1,2:0.5625,3:0.75,5:1,20:1,6:0.75,7:1,8:0.75,9:0.5625,10:0.75,11:0.5625,12:0.5625,16:0.5625,13:1,21:1,22:1,23:1,14:1,17:2,15:0.3164,25:0.3164,26:0.3164,28:0.3164,4:0,19:0};
function itemGS(info, hunter){
  if (!info || !info.ilvl) return 0;
  let q = info.quality, il = info.ilvl, qs = 1;
  if (q===5){qs=1.3;q=4} else if (q===0||q===1){qs=0.005;q=2} else if (q===7){q=3;il=187.05}
  if (q<2||q>4) q = Math.min(4,Math.max(2,q));
  let mod = GS_SLOTMOD[info.slot]; if (mod==null) return 0;
  if (hunter){ if ([13,21,22,17].includes(info.slot)) mod*=0.3164; if ([15,25,26].includes(info.slot)) mod*=5.3224; }
  const T = il>120 ? GS_A : GS_B; const ab = T[q] || T[2]; if (!ab) return 0;
  return Math.max(0, Math.floor(((il-ab[0])/ab[1]) * mod * 1.8618 * qs));
}
function gsColor(gs){
  if (gs>=6000) return "#ff8000"; if (gs>=5500) return "#ff3df0"; if (gs>=5000) return "#a335ee";
  if (gs>=4000) return "#0070dd"; if (gs>=3000) return "#1eff00"; return "#cfcfcf";
}
async function enrich(ch){
  const eq = (ch.equipment||[]).filter(e=>itemIdOf(e));
  const infos = await Promise.all(eq.map(e=>itemInfo(itemIdOf(e)).catch(()=>null)));
  const hunter = ch.class==="Hunter";
  let gs=0, ilSum=0, ilN=0, twoH=0;
  infos.forEach(i=>{ if(i && i.slot===17) twoH++; });
  eq.forEach(e=>{ e._tm = tmogOf(e); });
  if (!eq.some(e=>e._tm) && ch.realm!=="DEMO" && eq.length) { try { await tmogFromPage(ch, eq); } catch(x){} }
  const tms = await Promise.all(eq.map(e=>e._tm?itemInfo(e._tm).catch(()=>null):null));
  eq.forEach((e,k)=>{ const i=infos[k]; e._i=i; e._t=tms[k]; if(!i) return;
    let g=itemGS(i,hunter); if (twoH>=2 && i.slot===17) g=Math.floor(g/2); // titan's grip
    e._gs=g; gs+=g; if(i.ilvl && ![4,19].includes(i.slot)){ilSum+=i.ilvl; ilN++;} });
  ch._eq = eq; ch._gs = gs; ch._ilvl = ilN?Math.round(ilSum/ilN):0;
  return ch;
}

/* ---------- Navigation ---------- */
function go(view, params={}, push=true){
  if (push && S.view) S.stack.push({view:S.view, params:S.params});
  S.view=view; S.params=params;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===view));
  closeTip(); closeSheet(); render(); window.scrollTo(0,0);
}
window.bashBack = function(){ if ($(".tip")) { closeTip(); return true; }
  const p=S.stack.pop(); if(!p) return false; go(p.view,p.params,false); return true; };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.stack=[]; go(b.dataset.go,{},false); });
function head(title, sub, back){
  return `<header>${back?`<button class="back" onclick="bashBack()">‹</button>`:""}
  <div><h1 class="hand">${title}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div></header>`;
}
function render(){
  const v=S.view, app=$("#app");
  if (v==="home") app.innerHTML = viewHome();
  else if (v==="favs") app.innerHTML = viewFavs();
  else if (v==="settings") app.innerHTML = viewSettings();
  else if (v==="compare") viewCompare();
  else if (v==="dkp") app.innerHTML = viewDkp();
  else if (v==="char") viewChar(S.params);
  else if (v==="guild") viewGuild(S.params);
  bind();
}
function bind(){
  const f=$("#sform"); if(f) f.onsubmit=e=>{e.preventDefault(); const n=$("#sname").value.trim(); if(!n) return;
    const r=$("#srealm").value; S.realm=r; LS.set("realm",r);
    if ($("#stype").value==="guild") go("guild",{name:n,realm:r}); else go("char",{name:n,realm:r}); };
}

function rememberRecent(ch){
  const e={name:ch.name,realm:ch.realm,class:ch.class,race:ch.race,level:ch.level,online:!!ch.online,gs:ch._gs};
  S.recent=[e,...S.recent.filter(r=>!(r.name===e.name&&r.realm===e.realm))].slice(0,15); LS.set("recent",S.recent);
  const f=S.favs.find(r=>r.name===e.name&&r.realm===e.realm); if(f){Object.assign(f,e);LS.set("favs",S.favs);}
}
function isFav(n,r){return S.favs.some(f=>f.name===n&&f.realm===r)}
function toggleFav(){
  const ch=S.cur; if(!ch) return;
  if (isFav(ch.name,ch.realm)) S.favs=S.favs.filter(f=>!(f.name===ch.name&&f.realm===ch.realm));
  else S.favs.unshift({name:ch.name,realm:ch.realm,class:ch.class,race:ch.race,level:ch.level,online:!!ch.online,gs:ch._gs});
  LS.set("favs",S.favs); $("#favb").textContent=isFav(ch.name,ch.realm)?"★":"☆";
}

async function loadChar(name, realm){
  const k=realm+"/"+name.toLowerCase();
  if (S.cache[k]) return S.cache[k];
  const ch = await apiChar(name, realm); ch.realm = ch.realm || realm;
  await enrich(ch); S.cache[k]=ch; return ch;
}

  const q = i?i.quality:0, u = i?iconUrl(i.icon):"";
  return `<div class="${cls} b${q}" style="${u?`background-image:url('${u}')`:""}">${u?"":esc(label||"")}</div>`;
}
S.look = LS.get("look", true);
function lookToggle(){ return `<div class="chips" style="margin-bottom:10px"><button class="chip ${S.look?"on":""}" onclick="S.look=true;LS.set('look',true);viewChar(S.params)">👁 Kako izgleda u igri</button><button class="chip ${!S.look?"on":""}" onclick="S.look=false;LS.set('look',false);viewChar(S.params)">Pravi itemi</button></div>`; }
const tmCount = ch => (ch._eq||[]).filter(e=>e._t).length;

    return `<div class="item" onclick="showTip(${k})"><div style="position:relative">${icoHtml(shown, slotName(i&&i.slot).slice(0,4))}${t&&S.look?`<span class="tm">T</span>`:""}</div>
      <div style="flex:1;min-width:0"><div class="nm q${q}">${esc((i&&i.name)||e.name||("Item "+itemIdOf(e)))}</div>
      <div class="sm mut">${slotName(i&&i.slot)}${i&&i.ilvl?" · ilvl "+i.ilvl:""}</div>
      ${t?`<div class="sm" style="color:#c070ff">👁 izgleda kao: <span class="q${t.quality}">${esc(t.name)}</span></div>`:""}</div>
      ${e._gs?`<span class="sm" style="color:${gsColor(ch._gs)}">${e._gs}</span>`:""}</div>`; }).join("")}</div>`;

const SLOT_NAMES={1:"Glava",2:"Vrat",3:"Ramena",4:"Košulja",5:"Prsa",20:"Prsa",6:"Pojas",7:"Noge",8:"Stopala",9:"Zglobovi",10:"Ruke",11:"Prsten",12:"Trinket",13:"Jednoručno",21:"Glavna ruka",22:"Druga ruka",23:"Druga ruka",14:"Štit",15:"Daljinsko",25:"Bacanje",26:"Daljinsko",28:"Relic",16:"Plašt",17:"Dvoručno",19:"Tabard"};
const slotName = s => SLOT_NAMES[s]||"Item";
function showTip(k){
  const e=S.cur._eq[k]; const i=e&&e._i; closeTip();
  const d=document.createElement("div"); d.className="tip";
  d.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="q${i?i.quality:1}">${esc((i&&i.name)||e.name||"")}</b><button class="btn sm" onclick="closeTip()">✕</button></div>
   ${i&&i.tooltip?`<div>${sanitizeTip(i.tooltip)}</div>`:`<div class="mut">Tooltip nije dostupan.</div>`}
   <div style="margin-top:8px"><a href="https://www.wowhead.com/wotlk/item=${itemIdOf(e)}" target="_blank">Otvori na Wowheadu ↗</a></div>`;
  document.body.appendChild(d);
}
function showRaw(){
  const ch=S.cur; if(!ch) return; closeTip();
  const clean=JSON.parse(JSON.stringify(ch,(k,v)=>k.startsWith("_")?undefined:v));
  const d=document.createElement("div"); d.className="tip";
  d.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><b>Sirovi podaci</b><button class="btn sm" onclick="closeTip()">✕</button></div>
    <div class="sm mut">Transmog nađen: ${(ch._eq||[]).filter(e=>e._t).length} · ${esc(S.tmDebug||"API")}</div>
    <pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;color:#bfffa0">${esc(JSON.stringify((clean.equipment||[]).slice(0,4),null,1))}</pre>
    <div class="sm mut">Napravi screenshot i pošalji.</div>`;
  document.body.appendChild(d);
}
function closeTip(){ document.querySelectorAll(".tip").forEach(t=>t.remove()); }
function sanitizeTip(h){ const d=document.createElement("div"); d.innerHTML=h;
  d.querySelectorAll("script,iframe,object,embed,style,link").forEach(n=>n.remove());
  d.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{ if(/^on/i.test(a.name)||(a.name==="href"&&/^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); });
    if (n.tagName==="A"){ const h=n.getAttribute("href")||""; if(h.startsWith("/")) n.setAttribute("href","https://www.wowhead.com"+h); n.setAttribute("target","_blank"); } });
  return d.innerHTML; }

function tabTalents(ch){
  const t=ch.talents; if(!t||!t.length) return `<div class="card empty">Nema talenata.</div>`;
  return t.map((s,ix)=>{ let pts="";
    if (Array.isArray(s.points)) { const arr=s.points.map(p=>Array.isArray(p)?p.reduce((a,b)=>a+num(b),0):num(p)); pts=arr.join(" / "); }
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${ix===0?"Glavni spec":"Drugi spec"}</b><span class="badge">${esc(s.tree||"?")}</span></div>
    ${pts?`<div class="gs hand" style="margin-top:8px;color:var(--g)">${pts}</div>`:""}</div>`; }).join("");
}

  const p=ch.professions; if(!p||!p.length) return `<div class="card empty">Nema profesija.</div>`;

/* ---------- Paper doll + 3D model (Warmane's own viewer, in-app) ---------- */
const DOLL_L=[1,2,3,16,5,4,19,9], DOLL_R=[10,6,7,8,11,11,12,12], DOLL_B=["mh","oh",15];
function dollSlots(ch){
  const by={}; (ch._eq||[]).forEach((e,k)=>{ const s=e._i&&e._i.slot; if(!s) return;
    let key = s===20?5 : s===14||s===23||s===22?"oh" : s===21||s===17?"mh" : s===13?(by.mh?"oh":"mh") : (s===25||s===26||s===28)?15 : s;
    (by[key]=by[key]||[]).push(k); });
  return by;
}
function dollCell(ch, by, key, used){
  const list=by[key]||[]; const idx=(used[key]=(used[key]||0)); used[key]++;
  const k=list[idx]; const e=k!=null?ch._eq[k]:null; const i=e&&e._i; const t=e&&e._t&&S.look?e._t:null;
  const u=(t||i)?iconUrl((t||i).icon):"";
  return `<div class="slot ${i?"b"+i.quality:""}" ${k!=null?`onclick="showTip(${k})"`:""} style="${u?`background-image:url('${u}')`:""}">${t?`<span class="tm">T</span>`:""}${u?"":(i?esc(slotName(i.slot).slice(0,4)):"")}</div>`;
}
const warmaneUrl = (ch, page="summary") => `${ARMORY}/character/${encodeURIComponent(ch.name)}/${encodeURIComponent(ch.realm)}/${page}`;
function open3D(){
  const ch=S.cur; if(!ch) return;
  if (S.params.realm==="DEMO"){ toast("3D radi za prave likove"); return; }
  const url=warmaneUrl(ch,"summary");
  if (window.BashNative && window.BashNative.openWeb) window.BashNative.openWeb(url, ch.name+" · 3D", true);
  else window.open(url,"_blank");
}
function openBash3D(){
  const ch=S.cur; if(!ch) return;
  const race=RACE_ID[ch.race]; const gender=String(ch.gender||"").toLowerCase().startsWith("f")?1:0;
  if (!race){ toast("Nepoznata rasa"); return; }
  if (!(window.BashNative && window.BashNative.openModel)){ toast("Bash 3D radi u APK-u"); return; }
  const items=(ch._eq||[]).filter(e=>e._i).map(e=>({item:itemIdOf(e), transmog:num(e.transmog)||0, inv:e._i.slot||0, display:e._i.displayId||0}));
  window.BashNative.openModel(JSON.stringify({name:ch.name, race, gender, items}), ch.name+" · Bash 3D");
}
function openWarmane(page,title){
  const ch=S.cur; if(!ch) return; const url=warmaneUrl(ch,page);
  if (window.BashNative && window.BashNative.openWeb) window.BashNative.openWeb(url, title||ch.name, false);
  else window.open(url,"_blank");
}
function tabModel(ch){
  const by=dollSlots(ch), used={}; const col=CLASS[ch.class]||"#8cff2e";
  return `<div class="card" style="text-align:center">
    <div class="sm mut" style="margin-bottom:10px">3D lik s tvojim gearom${tmCount(ch)?" i transmogom":""}, kao u igri. Vrti ga prstom.</div>
    <button class="btn" style="width:100%;padding:16px;font-size:17px" onclick="openBash3D()">▶ Bash 3D lik</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="open3D()">Warmane 3D</button></div>
  <div class="card"><b>Oprema</b>${tmCount(ch)?`<div style="margin-top:8px">${lookToggle()}</div>`:""}<div class="doll" style="margin-top:10px">
    <div class="side">${DOLL_L.map(s=>dollCell(ch,by,s,used)).join("")}</div>
    <div class="center" style="color:${col}">
      <svg class="sil" viewBox="0 0 100 200" fill="currentColor" opacity=".35"><circle cx="50" cy="22" r="15"/><path d="M28 42h44l10 50-10 4-6-30v52l4 66H58l-8-56-8 56H30l4-66V66l-6 30-10-4z"/></svg>
      <div class="hand" style="margin-top:6px;font-size:20px">${esc(ch.name)}</div>
      <div class="sm mut">${esc(ch.race)} ${esc(ch.class)}</div>
      <div class="gs" style="margin:6px 0 10px;color:${gsColor(ch._gs)}">${ch._gs||""}</div>
    </div>
    <div class="side">${DOLL_R.map(s=>dollCell(ch,by,s,used)).join("")}</div>
    <div class="bottom">${DOLL_B.map(s=>dollCell(ch,by,s,used)).join("")}</div>
  </div></div>`;
}

const norm = t => String(t||"").toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g," ").trim();
async function postText(url, body){
  if (window.BashNative && window.BashNative.post){
    return new Promise((res,rej)=>{ const id="r"+(++reqId); pending[id]={res,rej}; window.BashNative.post(id,url,body);
      setTimeout(()=>{ if(pending[id]){delete pending[id];rej(new Error("Timeout"))} },30000); });
  }
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","X-Requested-With":"XMLHttpRequest"},body});

function unwrapHtml(t){ try{ const j=JSON.parse(t); if(typeof j==="string") return j;
  if(j&&typeof j==="object") return [j.content,j.html,j.data,j.achievements].filter(x=>typeof x==="string").join("\n") || JSON.stringify(j);
} catch(e){} return t||""; }
const DATE_RE = /(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{4}-\d{2}-\d{2})/;
function judge(doc, name){
  const target=norm(name); let best=null;
  for (const el of doc.querySelectorAll("body *")){
    if (el.children.length>3) continue;
    const tx=norm(el.textContent); if (!tx || tx.length>120) continue;
    if (tx===target || (tx.startsWith(target) && tx.length<target.length+40)) { best=el; break; }
  }
  if (!best) return {state:"no"};
  for (let go=true; go;){ go=false; for (const c of best.children){ if (norm(c.textContent)===norm(best.textContent)){ best=c; go=true; break; } } }
  let box=best.parentElement||best, hop=0;
  while (box.parentElement && hop<5){ const c=(box.className||"")+" "+(box.id||"");
    if (/achiev|ach_|ach-|item|row|entry|li/i.test(c) || box.tagName==="LI" || box.tagName==="TR") break;
    if (box.parentElement.tagName==="BODY") break; box=box.parentElement; hop++; }
  const cls=(box.className||"")+" "+[...box.querySelectorAll("*")].map(n=>n.className).join(" ");
  const txt=box.textContent||"";
  const dm=txt.match(DATE_RE);
  if (/locked|incomplete|unearned|not[-_ ]?earned|disabled/i.test(cls) && !dm) return {state:"no"};
  if (dm) return {state:"yes", date:dm[1]};
  if (/\bearned\b|complete|completed|unlocked/i.test(cls)) return {state:"yes"};
  return {state:"maybe"};
}

function classTrees(ch){ return (window.TALENTS||{})[ch.class]||null; }
function validSpec(str, trees){
  const total=trees.reduce((a,t)=>a+t.t.length,0);
  const d=str.replace(/[^0-9]/g,""); if (d.length<total) return null;
  const arr=d.slice(0,total).split("").map(Number);
  let k=0, sum=0; for (const t of trees) for (const x of t.t){ if (arr[k]>x[2]) return null; sum+=arr[k]; k++; }
  if (sum<1 || sum>71) return null;
  return arr;
}
function fromDashed(str, trees){ // "0550-23-005" style (wowhead / armory)
  const parts=str.split("-"); if (parts.length!==3) return null;
  const arr=[]; for (let i=0;i<3;i++){ const p=parts[i].padEnd(trees[i].t.length,"0").slice(0,trees[i].t.length); arr.push(...p.split("").map(Number)); }
  return validSpec(arr.join(""), trees);
}
function extractSpecs(raw, trees){
  const specs=[]; const total=trees.reduce((a,t)=>a+t.t.length,0);
  const add=a=>{ if(a && !specs.some(s=>s.join("")===a.join(""))) specs.push(a); };
  (raw.match(/[0-5]*-[0-5]*-[0-5]*/g)||[]).filter(m=>m.replace(/-/g,"").length>=3).forEach(m=>add(fromDashed(m,trees)));
  (raw.match(new RegExp("[0-5]{"+total+"}(?![0-9])","g"))||[]).forEach(m=>add(validSpec(m,trees)));
  if (!specs.length){ // rank texts "2/5" in page order
    const doc=new DOMParser().parseFromString(raw,"text/html");
    const ranks=[...doc.querySelectorAll("body *")].filter(e=>!e.children.length && /^\s*\d\s*\/\s*\d\s*$/.test(e.textContent)).map(e=>num(e.textContent.split("/")[0]));
    for (let o=0; o+total<=ranks.length && specs.length<2; o+=total) add(validSpec(ranks.slice(o,o+total).join(""),trees));
  }
  return specs.slice(0,2);
}
async function loadTalents(ch, realm){
  const trees=classTrees(ch); if(!trees) return {trees:null,specs:[]};
  if (realm==="DEMO") return {trees, specs:[DEMO_TAL(trees,[0,17,54]), DEMO_TAL(trees,[3,57,11])]};
  const k="tal_"+realm+"/"+ch.name.toLowerCase(); if (S.cache[k]) return S.cache[k];
  let specs=[];
  for (const s of (ch.talents||[])){ // API may already carry per-talent ranks
    const p=s.points||s.talents||s.string; if (!p) continue;
    if (typeof p==="string") { const a=fromDashed(p,trees)||validSpec(p,trees); if(a) specs.push(a); }
    else if (Array.isArray(p) && p.flat(3).length>=trees.reduce((a,t)=>a+t.t.length,0)) { const a=validSpec(p.flat(3).join(""),trees); if(a) specs.push(a); }
  }
  if (!specs.length){ try { specs=extractSpecs(await getText(warmaneUrl(ch,"talents")), trees); } catch(e){} }
  const out={trees,specs}; if (specs.length) S.cache[k]=out; return out;
}

async function dkpLoot(){
  const who=$("#dlw").value, cost=parseFloat($("#dlc").value); let item=$("#dli").value.trim();

  let id=0; const m=item.match(/item[=\/](\d+)/i)||item.match(/^(\d{3,6})$/); if (m) id=num(m[1]);
  let q=4; if (id){ const i=await itemInfo(id).catch(()=>null); if (i&&i.name){ item=i.name; q=i.quality; } }
  dkpLog({type:"loot", who:[who], amt:-Math.abs(cost), note:item, item:id, q}); closeSheet(); toast(`${who}: ${item} (−${Math.abs(cost)})`); render();
}

/* ---------- Guild ---------- */
async function viewGuild(p){
  const app=$("#app");
  app.innerHTML = head(esc(p.name), esc(p.realm), true) + `<div class="spin"></div>`;
  let gd; try { gd = await apiGuild(p.name,p.realm); } catch(e){ app.innerHTML = head(esc(p.name), esc(p.realm), true)+`<div class="card err">${esc(e.message)}</div>`; return; }
  if (S.view!=="guild" || S.params!==p) return;
  let roster=(gd.roster||gd.members||[]).map(m=>({...m, realm:p.realm}));
  const f = p.filter||"all", sort = p.sort||"level";
  const online = roster.filter(m=>m.online).length;
  const classes = {}; roster.forEach(m=>classes[m.class]=(classes[m.class]||0)+1);
  let list = roster.filter(m=> f==="all" || (f==="online"&&m.online) || m.class===f);
  list.sort((a,b)=> sort==="name"? String(a.name).localeCompare(b.name) : sort==="ach"? num(b.achievementpoints)-num(a.achievementpoints) : num(b.level)-num(a.level) || (b.online?1:0)-(a.online?1:0));
  app.innerHTML = head(`&lt;${esc(gd.name||p.name)}&gt;`, `${esc(p.realm)} · ${roster.length} članova · ${online} online`, true) + `
   <div class="card"><div class="chips" style="margin-bottom:8px">
     ${[["all","Svi"],["online","Online"]].map(([k,l])=>`<button class="chip ${f===k?"on":""}" onclick="S.params.filter='${k}';viewGuild(S.params)">${l}</button>`).join("")}
     ${Object.keys(classes).sort().map(c=>`<button class="chip ${f===c?"on":""}" style="color:${CLASS[c]||"#fff"}" onclick="S.params.filter='${esc(c)}';viewGuild(S.params)">${esc(c)} ${classes[c]}</button>`).join("")}</div>
     <div class="chips">${[["level","Level"],["name","Ime"],["ach","Achievementi"]].map(([k,l])=>`<button class="chip ${sort===k?"on":""}" onclick="S.params.sort='${k}';viewGuild(S.params)">↕ ${l}</button>`).join("")}</div></div>
   <div class="card list">${list.length?list.map(charRow).join(""):`<div class="empty">Nema članova.</div>`}</div>`;
}

  if (!a||!b){ app.innerHTML = head("Poredi","Dva lika jedan pored drugog") + `<div class="card empty">Otvori lik i klikni <b>⚔ Dodaj u poređenje</b>, pa isto za drugi lik.<br><br>${a?`Prvi: <b>${esc(a.name)}</b>`:""}</div>`; return; }
  app.innerHTML = head("Poredi","",false)+`<div class="spin"></div>`;

    ["Najbolja arena",Math.max(0,...(A.pvpteams||[]).map(x=>num(x.rating))),Math.max(0,...(B.pvpteams||[]).map(x=>num(x.rating)))]];
  const nm=(c)=>`<div style="text-align:center;cursor:pointer" onclick="go('char',${J({name:c.name,realm:c.realm})})"><div class="crest" style="margin:0 auto 6px;width:52px;height:52px;background:${CLASS[c.class]||"#8cff2e"}">${esc((c.class||"?")[0])}</div><b style="color:${CLASS[c.class]||"#fff"}">${esc(c.name)}</b><div class="sm mut">${esc(c.class)}</div></div>`;
  app.innerHTML = head("Poredi","") + `<div class="card"><div class="cmp">${nm(A)}${nm(B)}</div>
   <div style="margin-top:12px">${rows.map(([l,x,y])=>`<div class="vs"><div class="l ${x>y?"win":""}">${fmt(x)}</div><div class="m">${l}</div><div class="${y>x?"win":""}">${fmt(y)}</div></div>`).join("")}</div>

}

/* ---------- Hacker particle background ---------- */
(function fx(){
  const c=$("#fx"), x=c.getContext("2d"); let W,H,P=[];
  function rs(){ W=c.width=innerWidth; H=c.height=innerHeight; P=Array.from({length:Math.min(60,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3})); }
  rs(); addEventListener("resize",rs);
  (function loop(){ x.clearRect(0,0,W,H);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
      x.fillStyle="#8cff2e"; x.fillRect(p.x,p.y,1.6,1.6); }
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){ const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<110){ x.strokeStyle=`rgba(140,255,46,${(1-d/110)*.18})`; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } }
    requestAnimationFrame(loop); })();
})();
