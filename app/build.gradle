plugins {
    id 'com.android.application'
}

android {
    namespace 'com.basaofficial.basharmory'
    compileSdk 34

    defaultConfig {
        applicationId 'com.basaofficial.basharmory'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.2'
    }

    signingConfigs {
        bash {
            storeFile file('bash.keystore')
            storePassword 'basharmory'
            keyAlias 'bash'
            keyPassword 'basharmory'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.bash
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.bash
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

base {
    archivesName = 'BashArmory'
}
