<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--g:#8cff2e}
  html,body{margin:0;height:100%;background:#000;color:#e8ffe0;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  #m{position:fixed;inset:0;background:
      radial-gradient(ellipse 60% 55% at 50% 52%,rgba(140,255,46,.16),transparent 70%),
      radial-gradient(ellipse at 50% 120%,#0d1f07 0%,#000 60%)}
  #m canvas{width:100%!important;height:100%!important}
  #floor{position:fixed;left:20%;right:20%;bottom:13%;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,255,46,.35),transparent);filter:blur(4px);pointer-events:none}
  #bar{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
  #bar button{background:rgba(10,20,10,.8);color:var(--g);border:1px solid rgba(140,255,46,.4);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
  /* loader */
  #ld{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 45%,#0f2309,#000 70%);transition:opacity .6s}
  #ld.out{opacity:0;pointer-events:none}
  .ring{position:relative;width:86px;height:86px}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--g),transparent 70%);animation:sp 1s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
  .ring i{position:absolute;inset:9px;border-radius:50%;background:#111 center/cover;box-shadow:0 0 22px rgba(140,255,46,.35)}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ld .t{font-family:Cinzel,serif;font-size:18px;font-weight:900}
  #ld .st{font-size:12px;color:#9fbb93;min-height:16px}
  #ld .pb{width:150px;height:3px;border-radius:3px;background:#142312;overflow:hidden}
  #ld .pb i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#5fd400,var(--g));transition:width .5s}
  #ld .err{color:#ffb3b3;font-size:12px;text-align:center;padding:0 30px}
  #ld .wb{margin-top:4px;background:var(--g);color:#000;border:0;border-radius:10px;padding:9px 14px;font-weight:800}
</style>
</head>
<body>
<div id="m"></div>
<div id="floor"></div>
<div id="ui"></div>
<div id="ld"><div class="ring"><i id="ldi"></i></div><div class="t" id="ldn"></div><div class="st" id="lds">Učitavam…</div><div class="pb"><i id="ldp"></i></div></div>
<script>/*__PANELUI__*/</script>
<script>
/* Wowhead model viewer (wow.zamimg.com). The page runs on the wowhead.com origin
   (loadDataWithBaseURL) so the viewer can load its game data without CORS errors. */
const DATA = /*__DATA__*/null;
const CONTENT = "https://wow.zamimg.com/modelviewer/live/";
const ICON = n => n ? `https://wow.zamimg.com/images/wow/icons/large/${String(n).toLowerCase()}.jpg` : "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function step(t, pct){ $("lds").textContent = t; if (pct != null) $("ldp").style.width = pct + "%"; }
function fail(msg){
  $("ld").classList.remove("out");
  $("lds").innerHTML = `<div class="err">3D se nije učitao (${esc(msg)}).${firstErr && firstErr!==msg ? `<br><span style="opacity:.7">${esc(firstErr).slice(0,160)}</span>` : ""}</div>`;
  if (DATA && DATA.panel && window.BashPanel && BashPanel.warmaneEmbed) {
    $("lds").insertAdjacentHTML("beforeend", `<div class="st" style="margin-top:6px">Prebacujem na Warmane 3D…</div>`);
    setTimeout(() => BashPanel.warmaneEmbed(), 2500);
  } else if (window.BashPanel && BashPanel.warmane) $("lds").insertAdjacentHTML("afterend", `<button class="wb" onclick="BashPanel.warmane()">Otvori Warmane 3D</button>`);
}
let firstErr = "";
window.onerror = (m) => { if (!firstErr) firstErr = String(m); };
/* Globals the Wowhead viewer expects (same as wow-model-viewer/setup.js) */
window.CONTENT_PATH = CONTENT;
window.WOTLK_TO_RETAIL_DISPLAY_ID_API = "https://wotlk.murlocvillage.com/api/items";
window.WH = {
  debug: function(){}, defaultAnimation: "Stand",
  WebP: { getImageExtension: () => ".webp" },
  Wow: { Item: { INVENTORY_TYPE_HEAD:1, INVENTORY_TYPE_NECK:2, INVENTORY_TYPE_SHOULDERS:3, INVENTORY_TYPE_SHIRT:4, INVENTORY_TYPE_CHEST:5,
    INVENTORY_TYPE_WAIST:6, INVENTORY_TYPE_LEGS:7, INVENTORY_TYPE_FEET:8, INVENTORY_TYPE_WRISTS:9, INVENTORY_TYPE_HANDS:10, INVENTORY_TYPE_FINGER:11,
    INVENTORY_TYPE_TRINKET:12, INVENTORY_TYPE_ONE_HAND:13, INVENTORY_TYPE_SHIELD:14, INVENTORY_TYPE_RANGED:15, INVENTORY_TYPE_BACK:16,
    INVENTORY_TYPE_TWO_HAND:17, INVENTORY_TYPE_BAG:18, INVENTORY_TYPE_TABARD:19, INVENTORY_TYPE_ROBE:20, INVENTORY_TYPE_MAIN_HAND:21,
    INVENTORY_TYPE_OFF_HAND:22, INVENTORY_TYPE_HELD_IN_OFF_HAND:23, INVENTORY_TYPE_PROJECTILE:24, INVENTORY_TYPE_THROWN:25,
    INVENTORY_TYPE_RANGED_RIGHT:26, INVENTORY_TYPE_QUIVER:27, INVENTORY_TYPE_RELIC:28, INVENTORY_TYPE_PROFESSION_TOOL:29, INVENTORY_TYPE_PROFESSION_ACCESSORY:30 } }
};

function buildUi(){
  const d = DATA, ui = $("ui");
  $("ldn").textContent = d.name || "";
  $("ldn").style.color = d.color || "#8cff2e";
  if (d.classIcon) $("ldi").style.backgroundImage = `url('${ICON(d.classIcon)}')`;
  if (d.loading) return;
  if (d.panel) {
    window.buildPanelUi(d);
  } else {
    ui.innerHTML = `<div id="bar"><button onclick="anim('Stand')">Stoji</button><button onclick="anim('Attack1H')">Napad</button><button onclick="anim('EmoteDance')">Ples</button></div>`;
  }
}

/* Load scripts through the phone (BashNet) and run them inline: then a crash shows the real message instead of "Script error." */
function load(src){
  if (window.BashNet && BashNet.fetchText) {
    const code = BashNet.fetchText(src);
    if (!code) return Promise.reject(new Error("nema veze sa Wowheadom"));
    return new Promise((res, rej) => {
      const prev = window.onerror; let err = null;
      window.onerror = (m, f, l, c, e) => { err = e || new Error(m); return true; };
      const s = document.createElement("script"); s.textContent = code + "\n//# sourceURL=" + src; document.head.appendChild(s);
      window.onerror = prev;
      if (err) { firstErr = (err && err.message) || String(err); rej(new Error("Wowhead viewer: " + firstErr)); } else res();
    });
  }
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("nema veze sa Wowheadom")); document.head.appendChild(s); });
}

/* inventory type -> viewer slot (viewer uses WH.Wow.Item inventory types; weapons go to 21/22) */
function viewerSlot(inv, used){
  if ([13,17,21].includes(inv)) { if (!used[21]) return 21; return used[22] ? 0 : 22; }
  if (inv === 22) return 22;
  if (inv === 14 || inv === 23) return used[22] ? 0 : inv;
  if ([2,11,12,15,18,24,25,26,27,28].includes(inv)) return 0;  // neck, rings, trinkets, ranged: not drawn
  return inv;                                                  // head, shoulders, shirt, chest/robe, waist, legs, feet, wrists, hands, back(16), tabard
}
/* WotLK display id -> retail display id (same service wow-model-viewer uses) */
async function convertDisplay(itemId, wotlkDisplay){
  try {
    const r = await fetch(`${window.WOTLK_TO_RETAIL_DISPLAY_ID_API}/${itemId}/${wotlkDisplay}`);
    const j = await r.json(); const d = (j.data || j).newDisplayId;
    return d || wotlkDisplay;
  } catch (e) { return wotlkDisplay; }
}
/* Default look for race/gender (face, hair…) – required by the retail viewer */
async function customization(raceGender){
  try {
    const r = await fetch(`${CONTENT}meta/charactercustomization/${raceGender}.json`);
    const j = await r.json(); const o = (j.data || j).Options || [];
    return { options: o.filter(x => x.Choices && x.Choices.length).map(x => ({ optionId: x.Id, choiceId: x.Choices[0].Id })) };
  } catch (e) { return null; }
}
async function retailDisplay(itemId){
  try {
    const r = await fetch("/item=" + itemId + "&xml");
    const x = new DOMParser().parseFromString(await r.text(), "text/xml");
    const ic = x.querySelector("icon"), sl = x.querySelector("inventorySlot");
    const d = ic ? parseInt(ic.getAttribute("displayId"), 10) : 0;
    return { display: d || 0, inv: sl ? parseInt(sl.getAttribute("id"), 10) : 0 };
  } catch (e) { return { display: 0, inv: 0 }; }
}
let viewer = null;
function waitForCanvas(box){
  return new Promise(res => {
    let n = 0; const t = setInterval(() => { n++;
      const c = box.querySelector("canvas");
      if ((c && n > 6) || n > 40) { clearInterval(t); res(!!c); } }, 250);
  });
}
async function start(){
  if (!DATA) { fail("nema podataka"); return; }
  buildUi();
  if (DATA.loading) { step("Učitavam lika s Warmanea…", 15); return; }
  step("Učitavam 3D viewer…", 30);
  if (!window.jQuery) await load("https://code.jquery.com/jquery-3.7.1.min.js");
  await load(CONTENT + "viewer/viewer.min.js");
  if (typeof ZamModelViewer !== "function") throw new Error("Wowhead viewer se nije pokrenuo" + (firstErr ? ": " + firstErr : ""));
  step("Oblačim lika (gear i transmog)…", 55);
  const list = await Promise.all((DATA.items||[]).map(async it => {
    const look = it.transmog || it.item;
    let r = await retailDisplay(look);
    if (!r.display && it.transmog) r = await retailDisplay(it.item);
    if (!r.inv) r.inv = it.inv;
    if (!r.display && it.display) r.display = await convertDisplay(it.item, it.display);
    return r;
  }));
  const used = {}, items = [];
  list.forEach(r => { if (!r.display) return; const s = viewerSlot(r.inv, used); if (!s || used[s]) return; used[s] = 1; items.push([s, r.display]); });
  step("Crtam lika…", 80);
  const box = $("m");
  const raceGender = DATA.race * 2 - 1 + DATA.gender;
  const opts = {
    type: 2, contentPath: CONTENT, container: jQuery(box),
    aspect: box.clientWidth / box.clientHeight, hd: true,
    items: items,
    models: { id: raceGender, type: 16 }
  };
  const cc = await customization(raceGender);
  if (cc && cc.options.length) opts.charCustomization = cc;
  viewer = await new ZamModelViewer(opts);
  const ok = await waitForCanvas(box);
  if (!ok) throw new Error("model se nije nacrtao");
  step("Gotovo", 100);
  setTimeout(() => $("ld").classList.add("out"), 900);
}
function anim(a){ try { viewer && viewer.renderer && viewer.renderer.models[0].setAnimation(a); } catch (e) {} }
start().catch(e => fail(e.message));
</script>
</body>
</html>
