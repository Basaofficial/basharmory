name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testovi (ako padnu, nema novog APK-a)
        run: node tests/run.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version
        run: |
          VC=$(( ${{ github.run_number }} + 100 ))
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VER=$(tr -d '[:space:]' < version.txt).$VC" >> $GITHUB_ENV

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace -Pvc=${{ env.VC }} -Pvn=${{ env.VER }}
          cp app/build/outputs/apk/debug/BashArmory-debug.apk BashArmory.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BashArmory-apk
          path: BashArmory.apk

      - name: Notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          T=$(printf '%s\n' "$MSG" | head -n1 | sed -E 's/^v[0-9.]+: *//')
          printf '🆕 Nova verzija %s – %s\n' "$VER" "${T:-poboljšanja}" > notes.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: "#Bash Armory ${{ env.VER }}"
          files: BashArmory.apk
          body_path: notes.txt
          make_latest: true
