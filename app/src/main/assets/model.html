<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--g:#8cff2e}
  html,body{margin:0;height:100%;background:#000;color:#e8ffe0;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  #m{position:fixed;inset:0;background:
      radial-gradient(ellipse 60% 55% at 50% 52%,rgba(140,255,46,.16),transparent 70%),
      radial-gradient(ellipse at 50% 120%,#0d1f07 0%,#000 60%)}
  #m canvas{width:100%!important;height:100%!important}
  #floor{position:fixed;left:20%;right:20%;bottom:13%;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,255,46,.35),transparent);filter:blur(4px);pointer-events:none}
  /* gear around the model */
  .col{position:fixed;top:10px;bottom:62px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
  .col.l{left:8px}.col.r{right:8px}
  .bot{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:4}
  .s{position:relative;width:40px;height:40px;border-radius:8px;border:1.5px solid #2a2a2a;background:#0a0a0a center/cover;box-shadow:0 3px 10px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06)}
  .s.e{background:linear-gradient(160deg,#111,#060606);opacity:.55}
  .q1{border-color:#9d9d9d}.q2{border-color:#1eff00}.q3{border-color:#0070dd}.q4{border-color:#a335ee}.q5{border-color:#ff8000}.q6,.q7{border-color:#e6cc80}
  .q4{box-shadow:0 0 10px rgba(163,53,238,.35),0 3px 10px rgba(0,0,0,.8)}.q5{box-shadow:0 0 12px rgba(255,128,0,.45),0 3px 10px rgba(0,0,0,.8)}
  .s .tm{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:5px;border:1.5px solid #c070ff;background:#111 center/cover;box-shadow:0 0 8px rgba(192,112,255,.6)}
  .s.miss::after{content:"";position:absolute;left:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 6px #ff4d4d}
  /* name plate */
  #info{position:fixed;top:10px;left:58px;right:58px;text-align:center;z-index:4;pointer-events:none;text-shadow:0 2px 8px #000,0 0 2px #000}
  #info .n{font-family:Cinzel,serif;font-size:22px;font-weight:900;letter-spacing:.5px;line-height:1.1}
  #info .d{font-size:11px;color:#c9dcbf;margin-top:2px}
  #info .g{font-size:11px;color:var(--g);margin-top:1px}
  #info .on{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;margin-top:5px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid #333;letter-spacing:.5px;text-transform:uppercase}
  #info .on.y{border-color:rgba(140,255,46,.5);color:var(--g)}
  #info .dot{width:7px;height:7px;border-radius:50%;background:#666}
  #info .on.y .dot{background:var(--g);box-shadow:0 0 8px var(--g)}
  #gs{position:fixed;left:0;right:0;bottom:60px;text-align:center;z-index:4;pointer-events:none;text-shadow:0 2px 8px #000}
  #gs b{font-family:Cinzel,serif;font-size:17px;font-weight:900}
  #gs span{font-size:11px;font-weight:700;margin-left:6px}
  #tools{position:fixed;right:56px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
  .tb{width:30px;height:30px;border-radius:9px;background:rgba(10,20,10,.75);color:var(--g);border:1px solid rgba(140,255,46,.35);font-size:14px;font-weight:800;display:grid;place-items:center;padding:0}
  #bar{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
  #bar button{background:rgba(10,20,10,.8);color:var(--g);border:1px solid rgba(140,255,46,.4);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
  /* loader */
  #ld{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 45%,#0f2309,#000 70%);transition:opacity .6s}
  #ld.out{opacity:0;pointer-events:none}
  .ring{position:relative;width:86px;height:86px}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--g),transparent 70%);animation:sp 1s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
  .ring i{position:absolute;inset:9px;border-radius:50%;background:#111 center/cover;box-shadow:0 0 22px rgba(140,255,46,.35)}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ld .t{font-family:Cinzel,serif;font-size:18px;font-weight:900}
  #ld .st{font-size:12px;color:#9fbb93;min-height:16px}
  #ld .pb{width:150px;height:3px;border-radius:3px;background:#142312;overflow:hidden}
  #ld .pb i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#5fd400,var(--g));transition:width .5s}
  #ld .err{color:#ffb3b3;font-size:12px;text-align:center;padding:0 30px}
  #ld .wb{margin-top:4px;background:var(--g);color:#000;border:0;border-radius:10px;padding:9px 14px;font-weight:800}
</style>
</head>
<body>
<div id="m"></div>
<div id="floor"></div>
<div id="ui"></div>
<div id="ld"><div class="ring"><i id="ldi"></i></div><div class="t" id="ldn"></div><div class="st" id="lds">Učitavam…</div><div class="pb"><i id="ldp"></i></div></div>
<script>
/* Wowhead model viewer (wow.zamimg.com). The page runs on the wowhead.com origin
   (loadDataWithBaseURL) so the viewer can load its game data without CORS errors. */
const DATA = /*__DATA__*/null;
const CONTENT = "https://wow.zamimg.com/modelviewer/live/";
const ICON = n => n ? `https://wow.zamimg.com/images/wow/icons/large/${String(n).toLowerCase()}.jpg` : "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function step(t, pct){ $("lds").textContent = t; if (pct != null) $("ldp").style.width = pct + "%"; }
function fail(msg){
  $("ld").classList.remove("out");
  $("lds").innerHTML = `<div class="err">3D se nije učitao (${esc(msg)}).</div>`;
  if (window.BashPanel && BashPanel.warmane) $("lds").insertAdjacentHTML("afterend", `<button class="wb" onclick="BashPanel.warmane()">Otvori Warmane 3D</button>`);
}
window.onerror = (m) => fail(m);
window.WH = window.WH || {};
WH.debug = function(){}; WH.defaultAnimation = "Stand";
WH.WebP = { getImageExtension: () => ".webp" };
window.CONTENT_PATH = CONTENT;

function slotHtml(x){
  if (!x) return `<div class="s e"></div>`;
  return `<div class="s q${x.q} ${x.miss ? "miss" : ""}" style="background-image:url('${ICON(x.icon)}')" onclick="window.BashPanel&&BashPanel.tip(${x.k})">${x.tmIcon ? `<span class="tm" style="background-image:url('${ICON(x.tmIcon)}')"></span>` : ""}</div>`;
}
function buildUi(){
  const d = DATA, ui = $("ui");
  $("ldn").textContent = d.name || "";
  $("ldn").style.color = d.color || "#8cff2e";
  if (d.classIcon) $("ldi").style.backgroundImage = `url('${ICON(d.classIcon)}')`;
  if (d.loading) return;
  if (d.panel) {
    ui.innerHTML = `
      <div class="col l">${(d.left||[]).map(slotHtml).join("")}</div>
      <div class="col r">${(d.right||[]).map(slotHtml).join("")}</div>
      <div class="bot">${(d.bottom||[]).map(slotHtml).join("")}</div>
      <div id="info"><div class="n" style="color:${d.color||"#8cff2e"}">${esc(d.name)}</div>
        <div class="d">${esc(d.level)} ${esc(d.raceName)} ${esc(d.className)}</div>
        ${d.guild ? `<div class="g">&lt;${esc(d.guild)}&gt;</div>` : ""}
        <div class="on ${d.online ? "y" : ""}"><span class="dot"></span>${d.online ? "Online" : "Offline"}</div></div>
      <div id="gs">${d.gs ? `<b style="color:${d.gsColor}">${d.gs}</b>` : ""}${d.audit ? `<span style="color:${d.auditOk?"#8cff2e":"#ff6b6b"}">${esc(d.audit)}</span>` : ""}</div>
      <div id="tools"><button class="tb" onclick="BashPanel.full()">⤢</button><button class="tb" onclick="BashPanel.collapse()">▴</button></div>`;
  } else {
    ui.innerHTML = `<div id="bar"><button onclick="anim('Stand')">Stoji</button><button onclick="anim('Attack1H')">Napad</button><button onclick="anim('EmoteDance')">Ples</button></div>`;
  }
}

function load(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("nema veze sa Wowheadom")); document.head.appendChild(s); }); }

/* WotLK inventory type -> viewer slot */
function viewerSlot(inv, used){
  if (inv === 16) return 15;                 // back
  if (inv === 20) return 20;                 // robe
  if ([13,17,21].includes(inv)) { if (!used[21]) return 21; return 22; }
  if ([14,22,23].includes(inv)) return 22;
  if ([15,25,26,28,2,11,12].includes(inv)) return 0;
  return inv;
}
async function retailDisplay(itemId){
  try {
    const r = await fetch("/item=" + itemId + "&xml");
    const x = new DOMParser().parseFromString(await r.text(), "text/xml");
    const ic = x.querySelector("icon"), sl = x.querySelector("inventorySlot");
    const d = ic ? parseInt(ic.getAttribute("displayId"), 10) : 0;
    return { display: d || 0, inv: sl ? parseInt(sl.getAttribute("id"), 10) : 0 };
  } catch (e) { return { display: 0, inv: 0 }; }
}
let viewer = null;
function waitForCanvas(box){
  return new Promise(res => {
    let n = 0; const t = setInterval(() => { n++;
      const c = box.querySelector("canvas");
      if ((c && n > 6) || n > 40) { clearInterval(t); res(!!c); } }, 250);
  });
}
async function start(){
  if (!DATA) { fail("nema podataka"); return; }
  buildUi();
  if (DATA.loading) { step("Učitavam lika s Warmanea…", 15); return; }
  step("Učitavam 3D viewer…", 30);
  if (!window.jQuery) await load("https://code.jquery.com/jquery-3.7.1.min.js");
  await load(CONTENT + "viewer/viewer.min.js");
  if (typeof ZamModelViewer !== "function") throw new Error("viewer nije dostupan");
  step("Oblačim lika (gear i transmog)…", 55);
  const list = await Promise.all((DATA.items||[]).map(async it => {
    const look = it.transmog || it.item;
    let r = await retailDisplay(look);
    if (!r.display && it.transmog) r = await retailDisplay(it.item);
    if (!r.inv) r.inv = it.inv;
    if (!r.display) r.display = it.display || 0;
    return r;
  }));
  const used = {}, items = [];
  list.forEach(r => { if (!r.display) return; const s = viewerSlot(r.inv, used); if (!s || used[s]) return; used[s] = 1; items.push([s, r.display]); });
  step("Crtam lika…", 80);
  const box = $("m");
  viewer = new ZamModelViewer({
    type: 2, contentPath: CONTENT, container: jQuery(box),
    aspect: box.clientWidth / box.clientHeight, hd: true,
    items: items,
    models: { id: DATA.race * 2 - 1 + DATA.gender, type: 16 }
  });
  const ok = await waitForCanvas(box);
  if (!ok) throw new Error("model se nije nacrtao");
  step("Gotovo", 100);
  setTimeout(() => $("ld").classList.add("out"), 900);
}
function anim(a){ try { viewer && viewer.renderer && viewer.renderer.models[0].setAnimation(a); } catch (e) {} }
start().catch(e => fail(e.message));
</script>
</body>
</html>
